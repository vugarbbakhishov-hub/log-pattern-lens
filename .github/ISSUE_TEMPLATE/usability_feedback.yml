name: Usability feedback
description: Share what helped or blocked a log review task.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Log Pattern Lens. Submitted feedback is public.
        Use fictional examples only; do not attach private logs or reports.
        New here? Try the [sample walkthrough](https://github.com/vugarbbakhishov-hub/log-pattern-lens/blob/main/docs/try-it.md).
  - type: dropdown
    id: example
    attributes:
      label: Which example did you try?
      options:
        - Stack trace
        - Security review
        - Latency burst
        - My own fictional log
        - Another task
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to check?
      description: Describe the task without sharing private data.
      placeholder: I wanted to find repeated errors before reviewing the full log.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Did you complete the task?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, and what was confusing?
      description: Name the step or result that helped or blocked you. Suggestions are welcome.
    validations:
      required: true
  - type: textarea
    id: result_difference
    attributes:
      label: Did any result differ from the walkthrough?
      description: Optional. Name the metric or pattern, its expected result and what the app showed. Do not paste private data.
      placeholder: "Latency burst with WARN selected: expected two pattern groups; the app showed ..."
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox on Windows, Safari on iPhone
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included private data and understand this feedback will be public.
          required: true
