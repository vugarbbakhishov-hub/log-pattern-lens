name: Bug report
description: Report a log format that is parsed incorrectly or a UI problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Log Pattern Lens. Submitted issues are public.
        Use a built-in preset or fictional example; remove tokens, IPs, customer data and secrets.
        See the [sample walkthrough](https://github.com/vugarbbakhishov-hub/log-pattern-lens/blob/main/docs/try-it.md) for expected results.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Preset or minimal fictional log sample
      description: Name the built-in preset (Stack trace, Security review or Latency burst), or provide the smallest fictional excerpt that reproduces a parsing problem. A sample is optional for interface problems.
      render: text
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Mention whether you pasted text or opened a file, which preset and level filter you selected, and whether the problem affects the overview, pattern cards or a report.
      placeholder: "1. Choose Latency burst.\n2. Select WARN under Pattern level.\n3. Download the JSON report."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 18
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, customer data and personal data from the sample.
          required: true
