name: Bug report
description: Report a log format that is parsed incorrectly or a UI problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Log Pattern Lens. Remove tokens, IPs, customer data and secrets from every sample.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal anonymized log sample
      description: Provide the smallest log excerpt that reproduces the problem.
      render: text
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 18
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, tokens, customer data and personal data from the sample.
          required: true
